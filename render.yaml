services:
  - type: web
    name: campus-threads
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server.cloud
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: pilot
      - key: AUTH_MODE
        value: domain
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
