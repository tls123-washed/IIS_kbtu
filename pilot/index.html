<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- APP_BOOTSTRAP -->
  <title>Campus Threads · KBTU</title>
  <meta name="description" content="Обсуждения, сообщества и мероприятия КБТУ.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/pilot.css">
  <link rel="modulepreload" href="/assets/ui.js">
  <link rel="modulepreload" href="/assets/views.js">
</head>
<body>
  <a class="skip-link" href="#screen">Перейти к содержимому</a>
  <div class="desktop-layout">
    <aside class="sidebar">
      <a class="app-brand" href="/" aria-label="Campus Threads — главная">
        <span class="logo-mark">ct</span><span>Campus Threads<small>Казахстанско-Британский<br>технический университет</small></span>
      </a>
      <nav class="tabbar" id="navigation" aria-label="Навигация приложения"></nav>
      <button class="btn primary sidebar-compose" data-act="go" data-go="compose">Написать тред</button>
      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
          <span aria-hidden="true">◐</span><span id="themeLabel">Тёмная тема</span>
        </button>
        <div class="sidebar-account" id="sidebarAccount"></div>
      </div>
    </aside>
    <main class="workspace">
      <header class="workspace-header">
        <div><p class="eyebrow">CAMPUS THREADS</p><h1 id="pageTitle">Добро пожаловать</h1></div>
        <form class="header-search search" data-form="search" id="headerSearch">
          <input name="term" aria-label="Поиск по кампусу" placeholder="Поиск по кампусу" maxlength="100">
          <button type="submit" aria-label="Искать">↵</button>
        </form>
      </header>
      <div class="content-layout">
        <div class="phone" id="phone">
          <div class="screen" id="screen" tabindex="-1"><p class="empty" role="status">Подключаемся…</p></div>
        </div>
        <aside class="context-column" aria-label="В кампусе">
          <section class="context-section">
            <div class="context-heading"><h2>Ближайшие события</h2><button class="link" data-act="go" data-go="events">Все события</button></div>
            <div id="upcomingEvents"><p class="context-empty">Загружаем афишу…</p></div>
          </section>
          <section class="context-section">
            <h2>Твои сообщества</h2>
            <div id="myCommunities"></div>
          </section>
          <p class="context-footer">Campus Threads · КБТУ</p>
        </aside>
      </div>
    </main>
  </div>
  <script>
    // Это сообщение работает, даже если основной файл приложения не загрузился.
    (() => {
      let ready = false;
      function fail() {
        if (ready) return;
        const panel = document.createElement('div');
        panel.className = 'empty';
        panel.setAttribute('role', 'alert');
        const text = document.createElement('p');
        text.textContent = 'Не удалось загрузить приложение. Проверьте соединение и попробуйте ещё раз.';
        const retry = document.createElement('button');
        retry.className = 'btn primary';
        retry.textContent = 'Загрузить заново';
        retry.addEventListener('click', () => location.reload());
        panel.append(text, retry);
        document.getElementById('screen').replaceChildren(panel);
      }
      const timer = setTimeout(fail, 12000);
      window.campusStartup = { ready() { ready = true; clearTimeout(timer); } };
      window.addEventListener('error', event => {
        if (event.target?.id === 'campus-app') { clearTimeout(timer); fail(); }
      }, true);
    })();
  </script>
  <script type="module" id="campus-app" src="/assets/app.js"></script>
</body>
</html>
